name: al_ghafar_chakki
description: "A new Flutter shop management application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Packages
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4

  # Hardware & Scanner
  mobile_scanner: ^6.0.4
  qr_flutter: ^4.1.0

  # Thermal Printing & PDF Generation
  printing: ^5.13.3
  pdf: ^3.11.1

  # Communication, Formatting & State Management
  url_launcher: ^6.3.1
  provider: ^6.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  device_preview: ^3.0.0-prerelease3
  share_plus: ^10.0.0      # General receipt sharing ke liye

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E65100"
  adaptive_icon_foreground: "assets/images/app_logo.png"